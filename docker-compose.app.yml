services:
  chatgpt-on-wechat:
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      XIAOYOU_APP_AUTH_SECRET: '${XIAOYOU_APP_AUTH_SECRET:-}'
      XIAOYOU_APP_OWNER_USERNAME: '${XIAOYOU_APP_OWNER_USERNAME:-yoyo}'
      XIAOYOU_APP_OWNER_PASSWORD_HASH: '${XIAOYOU_APP_OWNER_PASSWORD_HASH:-}'
      XIAOYOU_APP_TEST_USERNAME: '${XIAOYOU_APP_TEST_USERNAME:-test}'
      XIAOYOU_APP_TEST_PASSWORD_HASH: '${XIAOYOU_APP_TEST_PASSWORD_HASH:-}'
      XIAOYOU_APP_ACCOUNT_DB_PATH: '${XIAOYOU_APP_ACCOUNT_DB_PATH:-/app/data/app_channel/accounts.db}'
      XIAOYOU_APP_SMTP_HOST: '${XIAOYOU_APP_SMTP_HOST:-}'
      XIAOYOU_APP_SMTP_PORT: '${XIAOYOU_APP_SMTP_PORT:-465}'
      XIAOYOU_APP_SMTP_USERNAME: '${XIAOYOU_APP_SMTP_USERNAME:-}'
      XIAOYOU_APP_SMTP_PASSWORD: '${XIAOYOU_APP_SMTP_PASSWORD:-}'
      XIAOYOU_APP_SMTP_FROM: '${XIAOYOU_APP_SMTP_FROM:-}'
      XIAOYOU_APP_SMTP_SSL: '${XIAOYOU_APP_SMTP_SSL:-true}'
      XIAOYOU_APP_EMAIL_DEBUG_CODE: '${XIAOYOU_APP_EMAIL_DEBUG_CODE:-false}'
      XIAOYOU_QQ_APP_ID: '${XIAOYOU_QQ_APP_ID:-}'
      XIAOYOU_QQ_APP_SECRET: '${XIAOYOU_QQ_APP_SECRET:-}'
      XIAOYOU_QQ_REDIRECT_URI: '${XIAOYOU_QQ_REDIRECT_URI:-https://xiaoyou.yoyoyan.cn/xiaoyou-app/v1/auth/qq/callback}'
